[workspace]
resolver = "2"
members = [
    "crates/oxidecode-sys",
    "crates/oxidecode-core",
    "crates/oxidecode-provider",
    "crates/oxidecode-tools",
    "crates/oxidecode-server",
    "crates/oxidecode-tui",
    "crates/oxidecode-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
repository = "https://github.com/its-zain-dev/oxidecode"
authors = ["OxideCode contributors"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
libc = "0.2"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
pulldown-cmark = "0.12"
rand = "0.8"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
